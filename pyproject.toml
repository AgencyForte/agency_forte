[project]
name = "insuretra-pipeline"
version = "0.1.0"
description = "Pipeline-first TDI intelligence foundation for Insuretra."
requires-python = ">=3.11"
dependencies = [
  "polars>=1.12.0",
  "psycopg[binary]>=3.2.3",
  "python-dotenv>=1.0.1",
  "requests>=2.32.3"
]

[project.optional-dependencies]
test = [
  "pytest>=8.3.3"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

